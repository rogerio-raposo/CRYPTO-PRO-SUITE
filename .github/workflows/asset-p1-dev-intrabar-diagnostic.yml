name: ASSET-P1 DEV intrabar diagnostic

on:
  push:
    branches:
      - execution/asset-p1-dev-recovery
    paths:
      - ".github/workflows/asset-p1-dev-intrabar-diagnostic.yml"
      - "03-componentes/24-asset/experimental/P1/execution/intrabar_diagnostic.py"

permissions:
  contents: read
  actions: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: execution/asset-p1-dev-recovery

      - uses: actions/checkout@v4
        with:
          ref: cbd80134aed0cf0f0796a9ecd870dc2201ef38c3
          path: suite-code

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@v4
        with:
          name: asset-p1-formal-dev-data
          path: /tmp/p1-dev-data/dev
          run-id: 37120970557
          github-token: ${{ github.token }}

      - name: Execute diagnostic-only intrabar comparison
        env:
          PYTHONPATH: ${{ github.workspace }}/suite-code/03-componentes/24-asset/experimental/P1/code
        run: |
          set -euo pipefail
          python 03-componentes/24-asset/experimental/P1/execution/intrabar_diagnostic.py             --data-root /tmp/p1-dev-data             --output /tmp/DEV_M3_INTRABAR_DIAGNOSTIC.json

      - uses: actions/upload-artifact@v4
        with:
          name: asset-p1-dev-m3-intrabar-diagnostic
          path: /tmp/DEV_M3_INTRABAR_DIAGNOSTIC.json
          if-no-files-found: error
          retention-days: 90
